<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#003399">
  <title>INK WAVE 記念画像ジェネレーター</title>
  <link rel="stylesheet" href="./css/style.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <main class="app">
    <header class="page-header">
      <p class="eyebrow">INK WAVE</p>
      <h1>記念画像ジェネレーター</h1>
      <p class="intro">写真とフレームを選んで、記念画像を作ろう。</p>
    </header>

    <section class="preview-section" aria-labelledby="preview-heading">
      <h2 id="preview-heading">完成イメージ</h2>
      <div class="preview-wrap">
        <canvas id="preview" width="1920" height="1080" aria-label="完成画像のプレビュー"></canvas>
        <div id="preview-placeholder" class="preview-placeholder">
          <span class="placeholder-icon" aria-hidden="true">＋</span>
          <span>まずは写真を選択</span>
          <span class="placeholder-sub">画像はこの端末内で処理される</span>
        </div>
      </div>
      <p id="status" class="status" role="status" aria-live="polite">写真を選ぶとプレビューが表示される。</p>
    </section>

    <section class="control-section" aria-labelledby="photo-heading">
      <h2 id="photo-heading">1. 写真を選ぶ</h2>
      <label class="primary-button file-button" for="photo-input">写真を選択</label>
      <input id="photo-input" class="visually-hidden" type="file" accept="image/*">
      <p class="help">ゲーム画面のスクリーンショットなどを選択する。横長の画像は16:9に自動で切り取られる。</p>
    </section>

    <section class="control-section" aria-labelledby="frame-heading">
      <h2 id="frame-heading">2. フレームを選ぶ</h2>
      <div id="frame-list" class="choice-list">
        <p class="muted">フレームを読み込み中…</p>
      </div>
      <p class="help">フレーム画像は <code>assets/frames/</code> に追加できる。</p>
    </section>

    <section class="control-section" aria-labelledby="logo-heading">
      <h2 id="logo-heading">3. INK WAVEロゴ</h2>
      <label class="field-label" for="logo-input">ロゴ素材</label>
      <select id="logo-input" class="select-control">
        <option value="">ロゴを使用しない</option>
      </select>

      <div id="logo-controls" class="logo-controls" hidden>
        <div class="slider-field">
          <div class="slider-heading">
            <label for="logo-x">横位置</label>
            <output id="logo-x-value" for="logo-x">78%</output>
          </div>
          <input id="logo-x" type="range" min="0" max="100" step="1" value="78">
          <div class="range-labels"><span>左</span><span>右</span></div>
        </div>

        <div class="slider-field">
          <div class="slider-heading">
            <label for="logo-y">縦位置</label>
            <output id="logo-y-value" for="logo-y">82%</output>
          </div>
          <input id="logo-y" type="range" min="0" max="100" step="1" value="82">
          <div class="range-labels"><span>上</span><span>下</span></div>
        </div>

        <div class="slider-field">
          <div class="slider-heading">
            <label for="logo-size">大きさ</label>
            <output id="logo-size-value" for="logo-size">18%</output>
          </div>
          <input id="logo-size" type="range" min="5" max="50" step="1" value="18">
          <div class="range-labels"><span>小</span><span>大</span></div>
        </div>

        <div class="slider-field">
          <div class="slider-heading">
            <label for="logo-rotation">回転角</label>
            <output id="logo-rotation-value" for="logo-rotation">0°</output>
          </div>
          <input id="logo-rotation" type="range" min="-180" max="180" step="5" value="0">
          <div class="range-labels"><span>-180°</span><span>180°</span></div>
        </div>

        <button id="reset-logo" class="secondary-button" type="button">ロゴの位置を戻す</button>
      </div>
    </section>

    <section class="actions" aria-label="画像の操作">
      <button id="reset-all" class="secondary-button" type="button">最初からやり直す</button>
      <button id="download" class="primary-button" type="button" disabled>画像を保存（PNG）</button>
    </section>

    <footer class="page-footer">
      <p>写真は外部サーバーに送信されず、このブラウザー内で処理される。</p>
    </footer>
  </main>
</body>
</html>
